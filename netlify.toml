# Netlify configuration for the dSocial showcase.
# Bun builds the app; the GenosDB engine is loaded from the CDN at runtime.
[build]
  command = "bun run build"
  publish = "dist"

# SPA fallback: client-side routes resolve to index.html. Real files (hashed
# assets) are served directly by Netlify before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
